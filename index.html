<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b111b"><title>Foodies Map</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;background:#090e17;color:#fff;font-family:system-ui,-apple-system,sans-serif}.phone{width:min(100vw,560px);margin:auto;position:relative;background:#101722}.art{display:block;width:100%;height:auto}.hot{position:absolute;background:transparent;border:0;cursor:pointer;border-radius:14px;touch-action:manipulation}.hot:focus-visible{outline:3px solid #ffc32c;background:#ffffff25}.hot:active{background:#ffc32c30}.sheet{position:fixed;inset:0;background:#060a12db;z-index:20;display:flex;align-items:flex-end;justify-content:center}.panel{background:#141b28;color:white;border:1px solid #48536a;border-radius:24px 24px 0 0;width:min(100%,560px);max-height:91dvh;overflow:auto;padding:22px 18px max(26px,env(safe-area-inset-bottom));box-shadow:0 -10px 50px #0009}.panel h2{margin:0 0 14px;font-size:23px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.close{border:1px solid #5a6373;background:#222d3e;color:white;font-size:24px;width:42px;height:42px;border-radius:50%}.item{background:#222d3e;border:1px solid #394456;color:white;width:100%;text-align:left;border-radius:14px;padding:14px;margin:7px 0;display:block}.item strong{display:block;font-size:16px}.muted{color:#b5bfcd;font-size:13px;line-height:1.5}.gold{background:#ffbd28!important;color:#111!important;border:0!important;font-weight:800!important}.action{padding:14px 17px;border-radius:13px;border:1px solid #637083;background:#263449;color:#fff;font-size:15px;cursor:pointer}.field{display:block;width:100%;padding:14px;margin:10px 0;border-radius:12px;border:1px solid #617087;background:#101824;color:white;font-size:16px}textarea.field{min-height:100px}.stars{display:flex;gap:7px;margin:12px 0}.stars button{font-size:32px;background:transparent;border:0;color:#777}.stars button.on{color:#ffc42c}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #697181;border-radius:30px;background:#263449;color:white;padding:8px 11px}.map{width:100%;height:48dvh;border:0;border-radius:14px}.status{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#233349;padding:9px 14px;border-radius:20px;z-index:30;font-size:13px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.note{background:#28384b;padding:11px;border-radius:12px;font-size:12px;color:#cbd4de}body:has(.sheet){overflow:hidden}
</style></head><body><div class="phone" id="phone"><img class="art" src="design.png" alt="Foodies Map mobile home screen, interactive photo buttons" id="design"></div><div id="overlay"></div><script>
const cityNames=['London','New York','Paris','Seoul'];const cityCoords=[[51.5074,-0.1278],[40.7128,-74.006],[48.8566,2.3522],[37.5665,126.978]];const cats=['Restaurants','Pubs & Bars','Coffee Shops','Wineries','Distilleries','Best View','Recipes','Pairing','Top Ranking','Vote & Review'];const demo={London:[['The Rooftop','Best View','Example listing — not verified'],['The Anchor Pub','Pubs & Bars','Example listing — not verified'],['Monmouth Coffee','Coffee Shops','Example listing — not verified']], 'New York':[['Skyline Dining','Best View','Illustrative listing'],['City Coffee','Coffee Shops','Illustrative listing']],Paris:[['Terrace Dining','Best View','Illustrative listing'],['Paris Café','Coffee Shops','Illustrative listing']],Seoul:[['Han River Dining','Best View','Illustrative listing'],['Seoul Coffee','Coffee Shops','Illustrative listing']]};const recipes=[['Espresso Martini','Vodka, espresso, coffee liqueur','Shake with ice and strain. Pair with dark chocolate.'],['Fish & Chips','White fish, potatoes, flour, sparkling water','Batter fish, fry until crisp. Pair with malt vinegar.'],['Flat White','Espresso, steamed milk','Pour fine microfoam over espresso. Pair with a pastry.']];let city='London',selected=null,stars=5;const phone=document.getElementById('phone'),overlay=document.getElementById('overlay');function hit(name,x,y,w,h,fn){const b=document.createElement('button');b.className='hot';b.style.cssText=`left:${x/941*100}%;top:${y/1672*100}%;width:${w/941*100}%;height:${h/1672*100}%`;b.setAttribute('aria-label',name);b.title=name;b.onclick=fn;phone.appendChild(b)}function show(title,body){overlay.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="panel"><div class="top"><h2>${escapeHtml(title)}</h2><button class="close" aria-label="Close" onclick="closeSheet()">×</button></div><div id="content">${body}</div></div></div>`}function closeSheet(){overlay.innerHTML=''}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let d=document.createElement('div');d.className='status';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}function chooseCity(i){city=cityNames[i];show('Explore '+city,`<p class="muted">Selected city: ${city}. The background image is the original London design; city-specific imagery is not substituted.</p><button class="action gold" onclick="places('All')">Explore ${city}</button> <button class="action" onclick="map()">Open map</button>`)}function places(cat='All',term=''){let arr=(demo[city]||[]).filter(p=>(cat==='All'||p[1]===cat)&&p.join(' ').toLowerCase().includes(term.toLowerCase()));let votes=JSON.parse(localStorage.getItem('fm-visual-votes')||'[]');show(cat==='All'?`Explore ${city}`:`${cat} · ${city}`,`<input class="field" id="filter" placeholder="Search ${city}…" value="${escapeHtml(term)}" oninput="filterPlaces('${escapeHtml(cat)}',this.value)"><div id="results">${renderPlaces(arr,votes)}</div><p class="note">Example listings are not verified venues or live rankings. User votes are stored locally on this device only.</p><button class="action" onclick="map()">Open ${city} map</button>`)}function renderPlaces(arr,votes){return arr.length?arr.map((p,i)=>`<button class="item" onclick="detail('${escapeHtml(p[0])}')"><strong>${escapeHtml(p[0])}</strong><span class="muted">${escapeHtml(p[1])} · ${escapeHtml(p[2])} · ${votes.filter(v=>v.city===city&&v.place===p[0]).length} local votes</span></button>`).join(''):'<p class="muted">No matching places in sample data.</p>'}function filterPlaces(cat,term){let arr=(demo[city]||[]).filter(p=>(cat==='All'||p[1]===cat)&&p.join(' ').toLowerCase().includes(term.toLowerCase()));document.getElementById('results').innerHTML=renderPlaces(arr,JSON.parse(localStorage.getItem('fm-visual-votes')||'[]'))}function detail(name){selected=name;show(name,`<p class="muted">${city} · Illustrative venue listing. No external rating is claimed.</p><button class="action gold" onclick="vote('${escapeHtml(name)}')">📷 Photograph & review</button> <button class="action" onclick="favorite('${escapeHtml(name)}')">♡ Save</button><p class="note">The design photo is AI-generated promotional imagery, not a photo of this venue.</p>`)}function favorite(name){let a=JSON.parse(localStorage.getItem('fm-favs')||'[]');if(!a.includes(name))a.push(name);localStorage.setItem('fm-favs',JSON.stringify(a));toast('Saved to favourites')}function vote(name=''){selected=name||selected;stars=5;show('Photo vote & review',`<p class="note">Demo: images are processed only in your browser and are not uploaded. This does not constitute verified attendance.</p><label>Place<select id="place" class="field"><option value="">Choose a place</option>${(demo[city]||[]).map(p=>`<option ${p[0]===selected?'selected':''}>${escapeHtml(p[0])}</option>`).join('')}</select></label><label>Food, drink or receipt photo<input id="photo" class="field" type="file" accept="image/*" capture="environment"></label><label>Dish or drink<input id="dish" class="field" placeholder="e.g. Espresso"></label><div class="stars" id="stars"></div><textarea id="comment" class="field" placeholder="Describe your experience"></textarea><button class="action gold" onclick="saveVote()">Save demo review</button><p id="validation" class="muted" role="status"></p>`);paintStars()}function paintStars(){let e=document.getElementById('stars');if(e)e.innerHTML=[1,2,3,4,5].map(n=>`<button class="${n<=stars?'on':''}" aria-label="${n} stars" onclick="stars=${n};paintStars()">★</button>`).join('')}function saveVote(){let place=document.getElementById('place').value,photo=document.getElementById('photo').files[0],dish=document.getElementById('dish').value.trim(),comment=document.getElementById('comment').value.trim();if(!place||!photo||!dish||!comment){document.getElementById('validation').textContent='Select a place, take a photo, enter a dish and write a comment.';return}if(!photo.type.startsWith('image/')){document.getElementById('validation').textContent='Only images are accepted.';return}let votes=JSON.parse(localStorage.getItem('fm-visual-votes')||'[]');votes.push({city,place,dish,comment,stars,created:new Date().toISOString(),status:'unverified-demo'});localStorage.setItem('fm-visual-votes',JSON.stringify(votes));show('Review saved',`<p>Your ${stars}-star demo review for <b>${escapeHtml(place)}</b> was saved locally.</p><p class="note">The photo was not saved or uploaded. No AI validation or anti-fraud verification was performed.</p><button class="action gold" onclick="places('All')">Back to places</button>`)}function map(){let i=cityNames.indexOf(city),c=cityCoords[i];show(`${city} map`,`<iframe class="map" title="OpenStreetMap" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${c[1]-.065}%2C${c[0]-.035}%2C${c[1]+.065}%2C${c[0]+.035}&layer=mapnik&marker=${c[0]}%2C${c[1]}"></iframe><p class="muted">Map © OpenStreetMap contributors. Pins for real businesses require a live place data source.</p>`)}function search(){show('Search '+city,`<input class="field" id="q" autofocus placeholder="Restaurants, coffee, views…" oninput="filterSearch(this.value)"><div id="results"></div><button class="action" onclick="places('All')">Browse all examples</button>`);filterSearch('')}function filterSearch(q){let arr=(demo[city]||[]).filter(p=>p.join(' ').toLowerCase().includes(q.toLowerCase()));document.getElementById('results').innerHTML=renderPlaces(arr,JSON.parse(localStorage.getItem('fm-visual-votes')||'[]'))}function recipe(){show('Recipes & pairing',recipes.map(r=>`<div class="item"><strong>${r[0]}</strong><p class="muted">${r[1]}</p><p>${r[2]}</p></div>`).join(''))}function rankings(){let votes=JSON.parse(localStorage.getItem('fm-visual-votes')||'[]').filter(v=>v.city===city),group={};votes.forEach(v=>{let g=group[v.place]||(group[v.place]={sum:0,n:0});g.sum+=v.stars;g.n++});let arr=Object.entries(group).sort((a,b)=>b[1].sum/b[1].n-a[1].sum/a[1].n);show('Local demo rankings',arr.length?arr.map(([n,g])=>`<div class="item"><strong>${escapeHtml(n)}</strong><span class="muted">★ ${(g.sum/g.n).toFixed(1)} · ${g.n} unverified votes</span></div>`).join(''):'<p class="muted">No local votes yet. Rankings will appear here after demo reviews are submitted.</p>')}function profile(){let favs=JSON.parse(localStorage.getItem('fm-favs')||'[]'),votes=JSON.parse(localStorage.getItem('fm-visual-votes')||'[]');show('My Foodies',`<h3>Favourites</h3>${favs.length?favs.map(n=>`<p>${escapeHtml(n)}</p>`).join(''):'<p class="muted">No favourites yet</p>'}<h3>My local reviews</h3><p>${votes.length} demo reviews on this device</p><button class="action" onclick="if(confirm('Delete local votes and favourites?')){localStorage.removeItem('fm-favs');localStorage.removeItem('fm-visual-votes');profile()}">Delete local data</button>`)}
// Touchable image coordinates match the exact 941×1672 generated artwork.
[[0,420,22,215,142],[1,420,238,225,142],[2,420,475,218,142],[3,420,705,215,142]].forEach(([i,y,x,w,h])=>hit(cityNames[i],x,y,w,h,()=>chooseCity(i)));
hit('Search',30,584,755,80,search);hit('Filters',807,584,105,80,()=>show('Filters',`<div class="chips">${cats.slice(0,6).map(c=>`<button class="chip" onclick="places('${c}')">${c}</button>`).join('')}</div>`));
for(let i=0;i<10;i++){let col=i%5,row=Math.floor(i/5);let x=23+col*184,y=690+row*193;hit(cats[i],x,y,175,176,()=>i===6||i===7?recipe():i===8?rankings():i===9?vote():places(cats[i]))}
hit('See all picks',780,1093,140,62,()=>places('All'));[[30,1167,305,292],[356,1167,285,292],[656,1167,260,292]].forEach(([x,y,w,h],i)=>hit('Open featured place '+i,x,y,w,h,()=>detail((demo.London[i]||demo.London[0])[0])));
[['Home',0,1495,175,160,()=>closeSheet()],['Map',186,1495,165,160,map],['Camera',378,1480,175,177,()=>vote()],['Ranking',570,1495,180,160,rankings],['My',765,1495,155,160,profile]].forEach(([n,x,y,w,h,fn])=>hit(n,x,y,w,h,fn));
</script></body></html>
